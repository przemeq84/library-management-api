# PostgreSQL. Connection settings come from optional DB_* environment variables
# (see .env.example). When they are not set, the client uses the local domain
# socket and the operating system user as the database role.
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV["DB_HOST"] %>
  port: <%= ENV["DB_PORT"] %>
  username: <%= ENV["DB_USER"] %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  primary:
    <<: *default
    database: library_management_api_development
  queue:
    <<: *default
    database: library_management_api_development_queue
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: library_management_api_test

production:
  primary: &primary_production
    <<: *default
    database: library_management_api_production
  queue:
    <<: *primary_production
    database: library_management_api_production_queue
    migrations_paths: db/queue_migrate
